# Experiment Configuration
# ============================================================
# Reproducibility record for DR-Screening-XAI
# ============================================================

experiment:
  name: DR-Screening-XAI-v1
  date: "2026-09-26"
  random_seed: 42

environment:
  python_version: "3.11"
  framework: pytorch
  key_libraries:
    torch: ">=2.0"
    torchvision: ">=0.15"
    opencv_python: ">=4.8"
    albumentations: ">=1.3"
    fastapi: ">=0.100"
    reportlab: ">=4.0"

model:
  architecture: EfficientNet-B0
  num_classes: 5
  input_size: 512
  pretrained: true
  checkpoint: models/classification/best_model.pth

dataset:
  name: APTOS-2019
  label_scheme: International Clinical DR Severity Scale
  classes:
    0: "No apparent DR"
    1: "Mild NPDR"
    2: "Moderate NPDR"
    3: "Severe NPDR"
    4: "Proliferative DR"
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  stratified: true
  duplicate_removal: true

preprocessing:
  resize: 512
  normalization_mean: [0.485, 0.456, 0.406]
  normalization_std: [0.229, 0.224, 0.225]
  clahe_clip_limit: 2.0
  clahe_tile_grid: [8, 8]

training:
  epochs: 10
  batch_size: 16
  learning_rate: 0.0001
  optimizer: Adam
  loss: CrossEntropyLoss
  class_imbalance_handling: WeightedRandomSampler
  early_stopping: false
  checkpointing: best_val_loss

evaluation:
  referable_threshold: 2
  target_sensitivity: 0.90
  target_specificity: 0.85
  metrics:
    - accuracy
    - balanced_accuracy
    - f1_macro
    - roc_auc_ovr
    - pr_auc_referable
    - referable_sensitivity
    - referable_specificity
    - ppv
    - npv

lesion_detection:
  method: OpenCV heuristic (morphological operations)
  microaneurysm_min_area: 5
  microaneurysm_max_area: 100
  hemorrhage_min_area: 100
  hemorrhage_max_area: 5000
  exudate_min_area: 50
  note: >
    Heuristic pipeline provides image-derived estimates.
    A trained DL model (e.g. U-Net on IDRiD lesion masks)
    would substantially improve sensitivity/specificity.

quality_assessment:
  blur_threshold: 100.0
  contrast_threshold: 0.2
  ungradable_threshold: 0.4
  borderline_threshold: 0.7

calibration:
  method: Temperature Scaling
  status: not_tuned
  default_temperature: 1.0
  note: Requires validation set to tune temperature parameter

explainability:
  method: Grad-CAM
  target_layer: model.features[-1]
  library: pytorch-grad-cam

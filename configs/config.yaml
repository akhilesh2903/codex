dataset:
  name: aptos
  root: ./tests/aptos2019-blindness-detection

image:
  size: 224

training:
  batch_size: 16
  epochs: 10
  learning_rate: 0.0001
  seed: 42

quality:
  threshold: 0.60

classification:
  model: efficientnet_b0
  num_classes: 5

referable:
  minimum_grade: 2

deployment:
  device: auto
